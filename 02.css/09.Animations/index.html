<!DOCTYPE html>
<html>
    <head>
        <title>CSS Animations</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h3>Letters rotate effect</h3>
        <div class="container">
            <div class="a">A</div>
            <div class="b">B</div>
        </div>
        <h3>Div rotate effect</h3>
        <div class="box"></div>

        <h3>Div rotate effect. Hover over the letters.</h3>
        <div class="letters-container">
            <div class="letters">
                <p>H</p>
                <p>E</p>
                <p>L</p>
                <p>L</p>
                <p>O</p>
            </div>
        </div>

        <h3>Keyframe animation loop</h3>
        <div class="expanding-box"></div> 

        <h3>Keyframed animation loop clock</h3>
        <div class="clock">
            <div class="minutes hand"></div>
            <div class="hours hand"></div>
        </div>
    </body>
</html>
