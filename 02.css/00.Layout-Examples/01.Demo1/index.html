<html>
    <head>
        <title>Responsive layout</title>
    </head>
    <body>
        <div class="container">
            <header>
                <div class="topheader orange flexbox-inline mb-15">
                    <div class="vertical-center">Header</div>
                </div>
                <nav class="green flexbox-inline mb-15">
                    <div class="vertical-center">Nav</div>
                </nav>
            </header>

            <main class="flexbox mb-15">
                <div class="main-content flexbox-inline deeppink">
                    <div class="vertical-center">Main</div>
                </div>
                <aside class="blue flexbox-inline">
                    <div class="vertical-center">Aside</div>
                </aside>
            </main>
        </div>

        <footer class="yellow flexbox-inline">
            <div class="vertical-center">Footer</div>
        </footer>

        <style>
            /* Main */
            *, *::before, *:after {
                margin:0;
                padding:0;
                box-sizing: border-box;
                font-family: sans-serif;
                font-size: 1.8rem;
            }

            body {
                height: 100vh;
                background-color: #ccc;
                padding:15px;

                display: flex;
                flex-direction: column;
            }

            /* Colors */

            .purple {
                background-color: rebeccapurple;
            }

            .orange {
                background-color: orangered;
            }

            .green {
                background-color: green;
            }

            .blue {
                background-color: blue;
            }

            .deeppink{
                background-color: deeppink;
            }

            .yellow {
                background-color: rgb(240, 166, 7);
            }

            /* Layout  */

            .container {
                /*takes all available space to push the footer to the bottom*/
                flex:1; 
            }

            .mb-15 {
                margin-bottom: 15px;
            }

            .topheader,
            footer,
            aside{
                min-height: 75px;
            }

            nav {
                height: 75px;
            }

            .flexbox {
                display:flex;
            }

            .main {
                justify-content: space-between;
                flex-wrap: wrap;
            }

            .main-content{
                flex:3;
                min-height: 300px;
                margin-right:15px;
            }

            aside {
                flex:1;
            }

            .flexbox-inline{
                display:flex;
            }

            .vertical-center{
                margin:auto;
                color:#fff;
            }

            @media(max-width:767px){

                main {
                    flex-direction: column;
                }

                .main-content{
                    margin-right: 0px;
                    margin-bottom: 15px;
                }
            }
        </style>
    </body>
</html>
